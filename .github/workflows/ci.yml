# Lightweight CI — supply-chain + unit lane only. The connected e2e suites need a
# running docker stack (midPoint/Keycloak) and are run locally per the Makefile, so
# this workflow deliberately stays fast and stack-free: typecheck, the no-stack unit
# tests, and a dependency audit. Actions are pinned by commit SHA (a version comment
# marks the tag); Dependabot keeps the SHAs current.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Lockfile-faithful install: fails on any package.json/lock drift.
      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Unit lane (registry/handlers/schema + scenario parity) — no running stack.
      - name: Unit tests
        run: make unit

      # Fail the build on a known high/critical advisory in the dependency tree.
      - name: Audit dependencies
        run: npm audit --audit-level=high
