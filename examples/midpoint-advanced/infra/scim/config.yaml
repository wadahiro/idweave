# scim-server config for the advanced example. One bearer-token tenant at /scim/v2
# acts as the Atlassian Guard SCIM endpoint the connector-atlassian-guard drives.
#
# The compatibility block matches what that connector expects from the server: it
# filters Groups by displayName (its unique-name check), reads each user's
# `groups`, and PATCHes group membership. The tenant overrides
# support_group_members_filter to FALSE — Atlassian Guard does not support
# filtering Groups by members.value, so this makes scim-server behave like it.
# SQLite lives on the scim_data volume at /data (the service runs as root so it
# can write there). Groups/users are provisioned by midPoint (the App Access role
# owns its group), not pre-seeded — a fresh `up` starts empty and the scenario
# fills it.
server:
  host: "0.0.0.0"
  port: 3000

backend:
  type: "database"
  database:
    type: "sqlite"
    # mode=rwc is required — without it the file is not created (SQLite CANTOPEN).
    url: "sqlite:/data/scim.db?mode=rwc"
    max_connections: 1

tenants:
  - id: 1
    path: "/scim/v2"
    auth:
      type: "bearer"
      token: "${SCIM_TOKEN}"
    # Atlassian Guard does not support filtering Groups by members.value.
    compatibility:
      support_group_members_filter: false

# Global defaults (the tenant above overrides support_group_members_filter).
compatibility:
  meta_datetime_format: "rfc3339"
  show_empty_groups_members: true
  include_user_groups: true
  support_group_members_filter: true
  support_group_displayname_filter: true
  support_patch_replace_empty_array: true
  support_patch_replace_empty_value: false
