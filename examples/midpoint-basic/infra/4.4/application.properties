# Spring Boot properties for the midPoint server, read from ${midpoint.home}/
# (MidPointSpringApplication sets spring.config.additional-location to
# optional:${midpoint.home}/, i.e. /opt/midpoint/var/application.properties).
#
# Disable Wicket page serialization (use an in-memory page store). midPoint 4.4's
# self-service shopping-cart / work-items search panel intermittently NPEs because
# SearchItemDefinition.def is `transient`: when Wicket serializes then restores a
# page, def becomes null and the panel reads it without re-resolving from its
# (non-transient) path → PropertySearchItem.getSearchItemType() → NPE → HTTP 500.
# Keeping pages in memory (never deserialized) keeps def populated, so the panel
# renders reliably. This is the root-cause fix for the 4.4 GUI request scenario.
wicket.no-serialization.enabled=true
